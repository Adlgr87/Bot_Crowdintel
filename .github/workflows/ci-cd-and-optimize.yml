name: CI/CD & Evolutive Optimization
 
# Runs on every push and daily at midnight
on:
  push:
    branches: [ main, remediation/compliance ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  # --- Job 1: Deterministic Build, Crypto Tests, Latency Gate ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake clang libcurl4-openssl-dev libssl-dev autoconf

    - name: Build libsecp256k1 v0.8.0
      run: |
        git clone --depth 1 --branch v0.8.0 https://github.com/bitcoin-core/secp256k1.git /tmp/secp256k1
        cd /tmp/secp256k1
        ./autogen.sh
        ./configure --enable-module-recovery --disable-tests --disable-bench --disable-shared
        make -j$(nproc)

    - name: Build with LTO/PGO Flags
      run: |
        cd core
        mkdir -p build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_FLAGS="-O3 -march=native -flto" \
          -DSECP256K1_LIBRARY=/tmp/secp256k1/.libs/libsecp256k1.a \
          -DSECP256K1_INCLUDE_DIR=/tmp/secp256k1/include \
          -DBUILD_DEMO=OFF \
          ..
        make -j$(nproc)

    - name: Run ctest (all tests)
      run: |
        cd core/build
        ctest --output-on-failure

    - name: Run Crypto Tests (Keccak-256 known-answer vectors)
      run: |
        cd core/build
        ./bin/test_signer

    - name: Run Latency Benchmark & Enforce Gate
      run: |
        cd core/build
        OUTPUT=$(./bin/latency_bench)
        echo "$OUTPUT"
        P50=$(echo "$OUTPUT" | grep "P50:" | head -1 | sed 's/.*P50:.*\t//; s/ us.*//')
        P99=$(echo "$OUTPUT" | grep "P99:" | head -1 | sed 's/.*P99:.*\t//; s/ us.*//')
        echo "P50: $P50 us, P99: $P99 us"
        if (( $(echo "$P50 >= 100" | bc -l) )); then
          echo "FAIL: P50 latency ${P50}us exceeds 100us threshold"
          exit 1
        fi
        if (( $(echo "$P99 >= 200" | bc -l) )); then
          echo "FAIL: P99 latency ${P99}us exceeds 200us threshold"
          exit 1
        fi
        echo "OK: Latency gates passed (P50=${P50}us < 100us, P99=${P99}us < 200us)"

