# Reviewed host policy for a dedicated Linux bare-metal execution host.
# This is an operator input file, not a shell script. Apply boot arguments only
# after measuring the actual host; never paste blindly into a cloud image.

[boot]
# Kernel command line (reserve two physical CPUs for the hot loop):
# isolcpus=managed_irq,2-3 nohz_full=2-3 rcu_nocbs=2-3
# irqaffinity=0-1 audit=0 nmi_watchdog=0
hot_cpus = "2-3"
cold_cpus = "1"

[process]
hot_scheduler = "SCHED_FIFO:80"
cold_scheduler = "SCHED_OTHER"
mlockall = true
cpu_governor = "performance"
transparent_hugepages = "never"

[network]
tcp_nodelay = true
tcp_quickack = true
# sysctl values are upper bounds; verify NIC/provider limits before applying.
net_core_rmem_max = 134217728
net_core_wmem_max = 134217728
net_ipv4_tcp_rmem = "4096 87380 67108864"
net_ipv4_tcp_wmem = "4096 65536 67108864"

[clock]
# chrony: use two or more independent stratum-1/2 sources approved by the host owner.
# maxoffset is an operational gate, not an official Polymarket requirement.
chrony_max_offset_ms = 10
chrony_poll_min = 4
chrony_poll_max = 6
rdtsc_invariant_required = true

[measurement]
# Never claim venue latency from a CPU-only benchmark.
tick_to_wire_target_us_p99 = 22
signature_target_us_p99 = 14
cpu_jitter_target_us_p99 = 2
