route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'canary-operator'

receivers:
  - name: 'canary-operator'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
      - url: 'http://localhost:8080/alert'
        http_config:
          basic_auth:
            username: 'alerts'
            password_file: '/run/secrets/alert_auth'
