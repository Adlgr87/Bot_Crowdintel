# ------------------------------------------------------------
# KiloCode — Documentación operativa y runbooks
# ------------------------------------------------------------
kilocode:
  role: "Documentación operativa y runbooks"
  provider: openrouter
  model: openai/gpt-4o-mini
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [runbooks, despliegue, rollback, documentacion_operativa]
