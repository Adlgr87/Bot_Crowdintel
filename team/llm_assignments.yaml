  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# ClaudeCode — Crítica técnica independiente (Red Team)
# ------------------------------------------------------------
claudecode:
  role: "Crítica técnica independiente y revisión de código"
  provider: openrouter
  model: google/gemini-2.5-pro
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [code_review, critical_analysis, red_team, risk_assessment]
  rationale: >
    Gemini 2.5 Pro como crítico independiente. NO implementa; intenta
    demostrar que está mal. Prohíbe aprobar su propio trabajo.
  deliverables:
    - BLOCKER list
    - HIGH RISK list
    - IMPROVEMENT list
    - 10-question adversarial review
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED
