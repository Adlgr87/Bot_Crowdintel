# Available LLM Backends (VERIFIED):
#
# 1. OpenRouter API (direct) - OPENROUTER_API_KEY from ~/.hermes/.env
#    Working models:
#      - google/gemini-2.5-pro (deep reasoning, security)
#      - google/gemini-2.5-flash (fast, research)
#      - openai/gpt-4o (coding, systems)
#      - openai/gpt-4o-mini (lightweight)
#      - openai/gpt-4.1-nano (fast, small)
#      - meta-llama/llama-4-maverick (large context)
#      - qwen/qwen3-235b-a22b (coding, large)
#      - deepseek/deepseek-chat (coding)
#
# 2. Ollama Local (http://localhost:11434)
#    Working models:
#      - qwen2.5:1.5b (fallback, small)
#
# 3. Subagent Tool (DSH native)
#    Default model: WORKS (verified)
#    Registered providers: ollama (cloud), poolside
#    Note: Session restricts model selection; default works for all agents.
#
# 4. Poolside (subagent provider)
#    Models: laguna-xs-2.1, laguna-s-2.1
#    Status: Registered but not accessible in this session (no credentials)
#
# NOT AVAILABLE (verified FAIL):
#   - auggie (aug/*)    — 502 SSE stream errors
#   - theoldllm (tllm/*) — 403 blocked by Vercel (egress IP)
#   - opencode (oc/*)   — 403 permission denied
#   - combo (auto/*)    — 429 rate limited (Felo)
#   - ddgw              — 418 anti-abuse challenge
#   - pepper            — 502 init failed

# ------------------------------------------------------------
# Director
# ------------------------------------------------------------
deepseek_harness:
  role: "Director técnico y orquestador inamovible"
  provider: self
  model: dsh-native
  capabilities: [orquestacion, asignacion, control_de_dependencias, decision]
  notes: "DeepShe Harness es el director — utiliza el agente que ejecuta este prompt"
  status: VERIFIED

# ------------------------------------------------------------
# Agent Prime — Arquitectura, contratos y decisiones técnicas
# ------------------------------------------------------------
agent_prime:
  role: "Arquitectura, contratos y decisiones técnicas"
  provider: openrouter
  model: google/gemini-2.5-pro
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [arquitectura, diseno_de_interfaces, ADR, criterios_de_aceptacion]
  rationale: >
    Gemini 2.5 Pro tiene profundo razonamiento para diseño arquitectónico.
    Ideal para definir hot/cold path, contratos de eventos y límites de riesgo.
  output_artifacts:
    - docs/ADR/
    - docs/IMPLEMENTATION_PLAN.md
    - docs/INTERFACES.md
    - docs/ACCEPTANCE_GATES.md
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# Agent Swarm — Paralelización y coordinación de tareas
# ------------------------------------------------------------
agent_swarm:
  role: "Paralelización y coordinación de subtareas"
  provider: openrouter
  model: google/gemini-2.5-flash
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [orquestacion_paralela, grafo_de_dependencias, asignacion_de_tracks]
  rationale: >
    Gemini 2.5 Flash es rápido y con buen razonamiento. Perfecto para
    coordinar tracks A-H sin conflictos de edición.
  tracks:
    - "Track A: build y CMake"
    - "Track B: criptografía"
    - "Track C: cliente CLOB"
    - "Track D: riesgo"
    - "Track E: tests"
    - "Track F: benchmark"
    - "Track G: infraestructura"
    - "Track H: documentación"
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# SWE Agent — Implementación principal de código
# ------------------------------------------------------------
swe_agent:
  role: "Implementación principal de código C++/CMake"
  provider: openrouter
  model: deepseek/deepseek-chat
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [cpp20, cmake, implementacion_de_modulos, patches]
  rationale: >
    DeepSeek Chat en OpenRouter es sólido para coding en C++/CMake.
    Ideal para implementar módulos y correcciones funcionales.
  deliverables:
    - patch
    - tests añadidos
    - comandos ejecutados
    - resultado
    - riesgos
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# OpenHands — Build, CI y Docker
# ------------------------------------------------------------
openhands:
  role: "Build, CI, Docker e integración de repositorio"
  provider: openrouter
  model: openai/gpt-4o
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [build_sistema, CI_CD, Docker, sanitizers, CTest]
  rationale: >
    GPT-4o en OpenRouter es sólido para tasks de build, CI y Docker.
    Verifica builds limpios y configuración de GitHub Actions.
  success_criteria:
    - build limpio en entorno nuevo
    - tests automáticos
    - Docker build correcto
    - Docker run correcto
    - CI sin pasos simulados
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# Hermes Agent — Seguridad, criptografía y revisión adversarial
# ------------------------------------------------------------
hermes_agent:
  role: "Seguridad, criptografía y revisión adversarial"
  provider: openrouter
  model: google/gemini-2.5-pro
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [keccak, EIP-712, secp256k1, adversarial, threat_modeling]
  rationale: >
    Gemini 2.5 Pro para profundidad de seguridad. Debe intentar ROMPER
    el sistema, no solo leerlo. Doble verificación con Agent Prime.
  deliverables:
    - SECURITY_REVIEW.md
    - CRYPTO_TEST_VECTORS.md
    - THREAT_MODEL.md
    - BLOCKERS.md
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# Poolside CLI — Rendimiento, benchmarks y profiling
# ------------------------------------------------------------
poolside_cli:
  role: "Performance, benchmarks y profiling"
  provider: openrouter
  model: meta-llama/llama-4-maverick
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [benchmarking, profiling, TSC_calibration, statistics]
  rationale: >
    Llama-4 Maverick tiene 1M+ tokens de contexto, ideal para análisis
    estadístico profundo de benchmarks y profiling.
  requirements:
    - Calibrar TSC con clock_gettime
    - Separar warm-up de muestras productivas
    - Publicar P50/P95/P99/P99.9/máximo/desviación
    - Nunca ignorar errores de try_push
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# OpenCode — Tests, refactors pequeños y mantenimiento
# ------------------------------------------------------------
opencode:
  role: "Tests, refactoring y mantenimiento"
  provider: openrouter
  model: openai/gpt-4o-mini
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [unit_tests, integration_tests, property_tests, fuzz_tests, refactoring]
  rationale: >
    GPT-4o-mini es eficiente para escribir tests y refactors pequeños.
    Ideal para unit tests, integration tests y fuzzing.
  note: >
    No cambia lógica financiera sin aprobación de Agent Prime y Hermes Agent.
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# Mistral Vibe — Investigación técnica y alternativas
# ------------------------------------------------------------
mistral_vibe:
  role: "Investigación técnica y alternativas"
  provider: openrouter
  model: google/gemini-2.5-flash
  fallback: ollama/qwen2.5:1.5b
  subagent_model: default
  capabilities: [investigacion_comparativa, benchmark_de_librerias, alternativas]
  rationale: >
    Gemini 2.5 Flash para investigación comparativa rápida:
    AF_XDP vs DPDK, librerías cripto, serialización, etc.
  output_format:
    - beneficio
    - coste
    - riesgo
    - complejidad
    - evidencia
    - recomendacion
  verification: "OK - tested via OpenRouter API"
  status: VERIFIED

# ------------------------------------------------------------
# OpenClaw — Revisión de integraciones
# ------------------------------------------------------------
openclaw:
  role: "Revisión de integraciones y operación nocturna"
  provider: openrouter
  model: openai/gpt-4o
  fallback: ollama/qwen2.5:1.5b
